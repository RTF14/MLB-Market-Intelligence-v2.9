name: Run MLB predictions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-live-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm secret is configured
        shell: bash
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "THE_ODDS_API_KEY repository secret is missing." >&2
            exit 1
          fi

      - name: Run next-game predictions
        id: predictions
        shell: bash
        run: |
          mkdir -p output
          set +e
          python live_pipeline.py 2>&1 | tee output/run.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Add edge-picks table to run summary
        if: always()
        shell: bash
        run: |
          if [ -f output/ALL_GAME_PREDICTIONS.md ]; then
            cat output/ALL_GAME_PREDICTIONS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# MLB v2.9 prediction run" >> "$GITHUB_STEP_SUMMARY"
            echo "The pipeline did not produce an edge-picks table." >> "$GITHUB_STEP_SUMMARY"
            if [ -f output/run.log ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 80 output/run.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload prediction outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mlb-v2-9-predictions-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
